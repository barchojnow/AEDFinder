[pytest]
# The Python here is build tooling, not an application, so the tests
# live beside the scripts they cover rather than in a tests/ tree.
testpaths = tools

# Fail on an unregistered marker rather than silently treating a typo'd
# @pytest.mark.slwo as "no marker at all" - a skipped guard is worse
# than a missing one, because it looks like coverage.
addopts = --strict-markers

markers =
    slow: brute-force property checks, a few seconds each (deselect with -m "not slow")
